---
name: 📄 Markdown Lint CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  markdownlint:
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-markdown-lint.yml@main
    with:
      config_file: '_config/.markdownlint.json'
      globs: 'docs/**/*.md *.md examples/**/*.md'
