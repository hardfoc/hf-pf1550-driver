<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">PF1550&lt;Bus&gt;, inc/pf1550.hpp</text>
<text x="56" y="578.4" font-size="20" font-weight="700" fill="#C7CBFF">Communication interface</text>
<text x="56" y="609" font-size="17" fill="#D2DAE4">pf1550::BusInterface&lt;Self&gt;: CRTP, no virtual calls; one-byte register reads and writes,</text>
<text x="56" y="633.7" font-size="17" fill="#D2DAE4">strap pins by name (STANDBY, USB_VBUS_EN, USB_OTG_EN) and the profile delay hook</text>
<text x="56" y="732.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="761.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">required:  Write()  Read()  EnsureInitialized()  GpioSet()</text>
<text x="56" y="784.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">optional:  DelayUs()</text>
<text x="56" y="883.4" font-size="20" font-weight="700" fill="#E8EDF3">PF1550</text>
<text x="56" y="914" font-size="17" fill="#D2DAE4">I2C up to 400 kHz, address 0x08  /  STANDBY in, INTB and RESETBMCU open drain</text>
<rect x="32" y="949.8" width="14" height="14" rx="4" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
