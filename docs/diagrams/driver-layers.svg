<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">PF1550&lt;Bus&gt;, inc/pf1550.hpp</text>
<text x="56" y="578.4" font-size="20" font-weight="700" fill="#3730A3">Communication interface</text>
<text x="56" y="609" font-size="17" fill="#2B3442">pf1550::BusInterface&lt;Self&gt;: CRTP, no virtual calls; one-byte register reads and writes,</text>
<text x="56" y="633.7" font-size="17" fill="#2B3442">strap pins by name (STANDBY, USB_VBUS_EN, USB_OTG_EN) and the profile delay hook</text>
<text x="56" y="732.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="761.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">required:  Write()  Read()  EnsureInitialized()  GpioSet()</text>
<text x="56" y="784.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">optional:  DelayUs()</text>
<text x="56" y="883.4" font-size="20" font-weight="700" fill="#17202C">PF1550</text>
<text x="56" y="914" font-size="17" fill="#2B3442">I2C up to 400 kHz, address 0x08  /  STANDBY in, INTB and RESETBMCU open drain</text>
